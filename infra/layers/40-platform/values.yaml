cloudflared:
  replicas: 2
  image: cloudflare/cloudflared:2026.5.0
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}

# Where the tunnel sends public traffic.
appService: http://two-feet.two-feet.svc.cluster.local

# Radar's UI, reachable only through the Cloudflare Access application on this hostname.
radarHost: radar.highclip.dev
radarService: http://radar.radar.svc.cluster.local:9280
