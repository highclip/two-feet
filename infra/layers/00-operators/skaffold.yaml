apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: two-feet-00-operators

# Cluster-wide operators. Requires the dash0-authorization-secret in dash0-system
# (infra/scripts/bootstrap-secrets.sh).
deploy:
  helm:
    releases:
      # Dash0 operator: cluster metrics, logs and Kubernetes events to Dash0. The app also sends its
      # own traces straight to Dash0 over OTLP (see 50-app), so app telemetry doesn't depend on
      # the operator's auto-instrumentation, which doesn't cover Go.
      - name: dash0-operator
        remoteChart: dash0-operator
        repo: https://dash0hq.github.io/dash0-operator
        # Pin after the first install: helm search repo dash0-operator/dash0-operator
        upgradeOnChange: true
        namespace: dash0-system
        createNamespace: true
        # deploy.sh exports these from cluster.yaml.
        setValueTemplates:
          operator.dash0Export.enabled: "true"
          operator.dash0Export.endpoint: "{{.DASH0_ENDPOINT}}"
          operator.dash0Export.apiEndpoint: "{{.DASH0_API_ENDPOINT}}"
          operator.dash0Export.secretRef.name: dash0-authorization-secret
          operator.dash0Export.secretRef.key: token
          operator.clusterName: "{{.CLUSTER_NAME}}"

      # Radar (skyhook-io/radar): Kubernetes UI with topology and a built-in MCP server, so
      # agents can inspect the cluster through it. Connected to Radar Cloud (app.radarhq.io) over an
      # outbound tunnel. Requires the radar-cloud-config secret in the radar namespace, holding the
      # cluster token under the key "token". Left out of the wizard's flags on purpose: Helm writes,
      # Secret viewing, pod exec, port-forward and self-upgrade.
      - name: radar
        remoteChart: radar
        repo: https://skyhook-io.github.io/helm-charts
        version: 1.20.2
        upgradeOnChange: true
        namespace: radar
        createNamespace: true
        setValues:
          allowedHosts[0]: radar.highclip.dev
          cloud.enabled: "true"
          cloud.url: wss://api.radarhq.io/agent
          cloud.clusterName: "-jsn8Wj4Zhk"   # hub-assigned cluster id, not a secret
          cloud.existingSecret: radar-cloud-config
          auth.mode: proxy
    flags:
      install: [--wait, --timeout=10m]
      upgrade: [--wait, --timeout=10m]
