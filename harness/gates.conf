# Gates for a Go app in app/. Sourced by harness/gates.sh.
# Every command runs from the repo root; a non-zero exit fails that gate.
# Keep the fast ones first: gates.sh runs them all and reports every failure at once.

GATES=(fmt vet lint tests gosec gitleaks vulns e2e)

# Tests that sign in need the Clerk test keys. They load here, inside the gate's own shell, so an
# agent sees test output but never the keys.
LOAD_ENV='if [ -f .env ]; then set -a; . ./.env; set +a; fi; '

CMD[fmt]='cd app && test -z "$(gofmt -l $(git ls-files "*.go" | grep -v "_templ.go"))"'
CMD[vet]='cd app && go vet ./...'
CMD[lint]='cd app && golangci-lint run ./...'
CMD[tests]="$LOAD_ENV"'cd app && go test -race -count=1 ./...'
CMD[gosec]='cd app && gosec -quiet -exclude-generated ./...'
# On a slice, everything since main. On main (the integrator), what isn't pushed yet, or the last merge.
# main..HEAD would be empty there and pass without scanning. -m includes conflict resolutions in merges.
CMD[gitleaks]='r="main..HEAD"; if [ "$(git branch --show-current)" = main ]; then r="HEAD^1..HEAD"; [ -n "$(git rev-list origin/main..HEAD 2>/dev/null)" ] && r="origin/main..HEAD"; fi; gitleaks detect --no-banner --redact --log-opts="-m $r"'
CMD[vulns]='cd app && govulncheck ./...'
# node_modules is gitignored, so a fresh checkout has to install first (found in the CLI dry run).
CMD[e2e]="$LOAD_ENV"'cd app/e2e && { [ -d node_modules ] || if [ -f package-lock.json ]; then npm ci --ignore-scripts --silent --no-fund --no-audit; else npm install --ignore-scripts --silent --no-fund --no-audit; fi; } && npx playwright test --reporter=line'
