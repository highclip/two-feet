apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    tunnel: {{ required "cloudflare.tunnelId is required in cluster.yaml" .Values.cloudflare.tunnelId }}
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      # SSE streams pass through the tunnel as long as the app flushes; keep connections open long.
      - hostname: {{ .Values.publicHost }}
        service: {{ .Values.appService }}
        originRequest:
          keepAliveTimeout: 10m
          disableChunkedEncoding: false
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.cloudflared.replicas }}
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
      annotations:
        checksum/config: {{ .Values | toJson | sha256sum }}
    spec:
      containers:
        - name: cloudflared
          image: {{ .Values.cloudflared.image }}
          args: [tunnel, --config, /etc/cloudflared/config/config.yaml, run]
          livenessProbe:
            httpGet: {path: /ready, port: 2000}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - {name: config, mountPath: /etc/cloudflared/config, readOnly: true}
            - {name: creds, mountPath: /etc/cloudflared/creds, readOnly: true}
          resources:
            {{- toYaml .Values.cloudflared.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: {name: cloudflared-config}
        - name: creds
          secret: {secretName: tunnel-credentials}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflared
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cloudflared
